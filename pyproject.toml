[project]
name = "streaming-insights-platform"
version = "0.1.0"
description = "Streaming event pipeline with LLM enrichment, dbt warehouse, orchestration and serving"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "requests>=2.32",
    "duckdb>=1.1",
    "pandas>=2.2",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dbt-bigquery>=1.8",
    "google-cloud-bigquery>=3.25",
    "great-expectations>=1.3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "streamlit>=1.40",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
